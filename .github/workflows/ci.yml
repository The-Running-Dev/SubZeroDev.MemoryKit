name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Whitespace
        # verification: true
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  node:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.18', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        # verification: true
        run: npm run typecheck

      - name: Lint
        # verification: true
        run: npm run lint

      - name: Test
        # verification: true
        run: npm test

      - name: Package
        # verification: true
        run: npm run check:package

  # The baseline benchmark and the retrieval evaluation, run by hand: their reports go to the job
  # summary.
  bench:
    name: Benchmark
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Benchmark
        run: npm run bench -- --out "$GITHUB_STEP_SUMMARY"

      - name: Retrieval evaluation
        run: npm run eval -- --filler 0,10000 --out "$GITHUB_STEP_SUMMARY"
